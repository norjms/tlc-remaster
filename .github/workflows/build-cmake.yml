name: Build (CMake, SDL3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest,  name: linux-x64 }
          - { os: macos-latest,   name: macos-universal }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      HAVE_DEVID: ${{ secrets.MACOS_DEVID_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies (for SDL3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then extra+=(-G Ninja); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix dist/StarflightTLC

      # Developer ID signing + notarization. Runs once the MACOS_DEVID_P12
      # secret exists (it is not available to pull requests from forks).
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAVE_DEVID == 'true'
        env:
          DEVID_P12: ${{ secrets.MACOS_DEVID_P12 }}
          DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCP=$(openssl rand -hex 24)
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          echo "$DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "Signing as: $ID"
          APP=dist/StarflightTLC/starflighttlc.app
          codesign --force --options runtime --timestamp --sign "$ID" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/asc.p8"
          security delete-keychain "$KC"

      # Start the game headless, click New Game, dismiss the first dialog,
      # quit, and check the modules came up. Screenshots are uploaded.
      - name: Smoke test
        shell: bash
        env:
          # offscreen needs EGL, which macOS lacks; dummy works everywhere
          SDL_VIDEO_DRIVER: ${{ runner.os == 'macOS' && 'dummy' || 'offscreen' }}
          A4_SHOT_FRAMES: "60,200"
          A4_INPUT: "60:click=512,500;150:click=800,658;260:quit"
        run: |
          mkdir -p shots
          export A4_SHOT_DIR="$PWD/shots"
          case "$RUNNER_OS" in
            Windows) exe=dist/StarflightTLC/starflighttlc.exe ;;
            macOS)   exe=dist/StarflightTLC/starflighttlc.app/Contents/MacOS/starflighttlc ;;
            *)       exe=dist/StarflightTLC/starflighttlc ;;
          esac
          # the injected input quits the game; the loop is only a safety net
          "$exe" & pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          wait $pid || echo "game exit code $?"
          # signed/read-only installs write to the per-user game folder
          log=$( (find dist "$HOME/Library/Application Support/Starflight" "$HOME/.local/share/Starflight" -name output.txt 2>/dev/null || true) | head -1)
          cp "$log" smoke-output.txt
          rm -f "$log"
          tail -n 25 smoke-output.txt
          grep -q "module TITLESCREEN Init(): SUCCESS" smoke-output.txt
          grep -q "module CAPTAINCREATION Init(): SUCCESS" smoke-output.txt
          grep -q "Shutdown completed" smoke-output.txt
          ls shots

      - uses: actions/upload-artifact@v7
        with:
          name: StarflightTLC-${{ matrix.name }}-${{ github.sha }}
          path: dist

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: |
            shots
            smoke-output.txt
