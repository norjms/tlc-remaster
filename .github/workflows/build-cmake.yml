name: Build (CMake, SDL3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest,  name: linux-x64 }
          - { os: macos-latest,   name: macos-universal }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies (for SDL3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then extra+=(-G Ninja); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix dist/StarflightTLC

      # Start the game headless, click New Game, dismiss the first dialog,
      # quit, and check the modules came up. Screenshots are uploaded.
      - name: Smoke test
        shell: bash
        env:
          # offscreen needs EGL, which macOS lacks; dummy works everywhere
          SDL_VIDEO_DRIVER: ${{ runner.os == 'macOS' && 'dummy' || 'offscreen' }}
          A4_SHOT_FRAMES: "60,200"
          A4_INPUT: "60:click=512,500;150:click=800,658;260:quit"
        run: |
          mkdir -p shots
          export A4_SHOT_DIR="$PWD/shots"
          case "$RUNNER_OS" in
            Windows) exe=dist/StarflightTLC/starflighttlc.exe ;;
            macOS)   exe=dist/StarflightTLC/starflighttlc.app/Contents/MacOS/starflighttlc ;;
            *)       exe=dist/StarflightTLC/starflighttlc ;;
          esac
          # the injected input quits the game; the loop is only a safety net
          "$exe" & pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          wait $pid || echo "game exit code $?"
          log=$(find dist -name output.txt | head -1)
          cp "$log" smoke-output.txt
          rm -f "$log"
          tail -n 25 smoke-output.txt
          grep -q "module TITLESCREEN Init(): SUCCESS" smoke-output.txt
          grep -q "module CAPTAINCREATION Init(): SUCCESS" smoke-output.txt
          grep -q "Shutdown completed" smoke-output.txt
          ls shots

      - uses: actions/upload-artifact@v7
        with:
          name: StarflightTLC-${{ matrix.name }}-${{ github.sha }}
          path: dist

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: |
            shots
            smoke-output.txt
